<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop & Drop </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- Heading -->
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">Drag & Drop to Play</p>

        <button class="restart">Restart</button>



        <!-- Tic Tac Toe Board -->
        <div class="board">

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

        </div>

        <!-- Pieces -->
        <div class="pieces">

            <p>Drag the pieces</p>

            <div class="piece-container">

                <div class="piece x-piece" draggable="true">X</div>
                <div class="piece o-piece" draggable="true">O</div>
                <div class="piece x-piece" draggable="true">X</div>
                <div class="piece o-piece" draggable="true">O</div>
                <div class="piece x-piece" draggable="true">X</div>
                <div class="piece o-piece" draggable="true">O</div>
                <div class="piece x-piece" draggable="true">X</div>
                <div class="piece o-piece" draggable="true">O</div>
                <div class="piece x-piece" draggable="true">X</div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
